name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to a PR branch makes the first run pointless, so PR runs share
# one group per ref and cancel. On main every squash commit is its own
# verification: each gets its own group by SHA, because a shared group would
# still replace a queued run with the next one even without cancel-in-progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The main ruleset requires this job by its id. Renaming it, giving it a
  # `name:`, adding a matrix, or adding a `paths:` filter to the triggers would
  # leave every PR waiting forever on a status that never reports.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          # .nvmrc is the one Node pin (26+): litmus runs straight from
          # TypeScript by type stripping.
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
